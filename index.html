<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>LavinaBooking CRM Field Renderer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
    }

    /* Контейнер поля */
    .wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Основная кнопка */
    .btn {
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Стрелка dropdown */
    .arrow {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f5f5f5;
      cursor: pointer;
    }

    /* dropdown */
    .dropdown {
      position: absolute;
      margin-top: 6px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      min-width: 220px;
      display: none;
      z-index: 9999;
    }

    .item {
      padding: 8px;
      cursor: pointer;
    }

    .item:hover {
      background: #f2f2f2;
    }

    .code {
      font-size: 11px;
      color: #999;
      margin-left: 6px;
    }
  </style>
</head>

<body>

<div class="wrap">
  <button id="mainBtn" class="btn">Загрузка...</button>
  <button id="arrowBtn" class="arrow">▼</button>
</div>

<div id="dropdown" class="dropdown"></div>

<script>

  /* =========================
     1. ДАННЫЕ
     ========================= */

  let hotels = [
    { name: "ОТЕЛЬ 1", providerId: "16478" },
    { name: "ОТЕЛЬ 2", providerId: "22222" },
    { name: "ОТЕЛЬ 3", providerId: "33333" }
  ];

  let selectedHotel = hotels[0];

  let dealId = null;
  let contactId = null;

  /* =========================
     2. BITRIX SAFE INIT
     ========================= */

  function initBitrix() {

    if (typeof BX24 === "undefined") {
      console.warn("BX24 not found → standalone mode");
      return;
    }

    BX24.init(function () {

      try {
        const placement = BX24.placement.info();

        dealId = placement?.options?.ID || null;

        console.log("Deal ID:", dealId);

      } catch (e) {
        console.error("Bitrix init error", e);
      }

      /* =========================
         2.1 AUTO FIELD CHECK + CREATE
         ========================= */

      ensureFieldExists();
    });
  }

  /* =========================
     3. СОЗДАНИЕ / ПРОВЕРКА ПОЛЯ
     ========================= */

  function ensureFieldExists() {

    BX24.callMethod(
      "crm.userfield.list",
      {
        filter: { FIELD_NAME: "UF_CRM_LAVINA_BOOKING_BUTTOM" }
      },
      function (res) {

        const fields = res.data();

        if (!fields || fields.length === 0) {

          console.log("Field not found → creating");

          BX24.callMethod(
            "crm.userfield.add",
            {
              fields: {
                FIELD_NAME: "UF_CRM_LAVINA_BOOKING_BUTTOM",
                USER_TYPE_ID: "string",
                EDIT_FORM_LABEL: "Lavina Booking Button",
                LIST_COLUMN_LABEL: "Lavina Booking"
              }
            },
            function (r) {
              console.log("Field created", r);
            }
          );

        } else {
          console.log("Field already exists");
        }
      }
    );
  }

  /* =========================
     4. UI RENDER
     ========================= */

  function render() {
    document.getElementById("mainBtn").innerText =
      `Забронировать в ${selectedHotel.name}`;
  }

  function renderDropdown() {

    const dd = document.getElementById("dropdown");
    dd.innerHTML = "";

    hotels.forEach(h => {

      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `${h.name} <span class="code">${h.providerId}</span>`;

      div.onclick = () => {
        selectedHotel = h;
        render();
        dd.style.display = "none";
      };

      dd.appendChild(div);
    });
  }

  /* =========================
     5. TRAVELLINE OPEN
     ========================= */

  function openTravelLine() {

    const payload = {
      firstName: "Test",
      lastName: "User",
      providerId: selectedHotel.providerId,
      dealId: dealId || "0",
      contactId: contactId || "0"
    };

    const url =
      "https://secure.travelline.ru/app/webpms/extranet/#/WebPmsBookingNew/" +
      encodeURIComponent(JSON.stringify(payload)) +
      "/WebPmsReservations";

    window.open(url, "_blank");
  }

  /* =========================
     6. EVENTS
     ========================= */

  function bindEvents() {

    const btn = document.getElementById("mainBtn");
    const arrow = document.getElementById("arrowBtn");
    const dd = document.getElementById("dropdown");

    btn.addEventListener("click", openTravelLine);

    arrow.addEventListener("click", (e) => {
      e.stopPropagation();
      dd.style.display = dd.style.display === "block" ? "none" : "block";
    });

    document.addEventListener("click", () => {
      dd.style.display = "none";
    });
  }

  /* =========================
     7. START
     ========================= */

  window.addEventListener("load", () => {

    render();
    renderDropdown();
    bindEvents();
    initBitrix();

  });

</script>

</body>
</html>
