<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Lavina Booking Bitrix App</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .log {
      font-size: 12px;
      color: #444;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<h3>Lavina Booking — Bitrix Init</h3>

<div class="log" id="log">Ожидание запуска...</div>

<script>

let fieldCreated = false;

/* =========================
   ЛОГИ
========================= */
function log(msg) {
  document.getElementById("log").innerText += "\n" + msg;
}

/* =========================
   1. ИНИЦИАЛИЗАЦИЯ BITRIX
========================= */
function initBitrix() {

  if (typeof BX24 === "undefined") {
    log("❌ BX24 не найден — приложение открыто вне Bitrix");
    return;
  }

  BX24.init(function () {

    log("✔ BX24 инициализация успешна");

    try {
      const placement = BX24.placement.info();
      log("✔ Placement получен: " + JSON.stringify(placement));
    } catch (e) {
      log("⚠ Placement недоступен");
    }

    ensureFieldExists();
  });
}

/* =========================
   2. СОЗДАНИЕ ПОЛЯ CRM
========================= */
function ensureFieldExists() {

  if (fieldCreated) return;

  log("🔎 Проверяем пользовательское поле...");

  BX24.callMethod(
    "crm.userfield.list",
    {
      filter: {
        FIELD_NAME: "UF_CRM_LAVINA_BOOKING_BUTTON"
      }
    },
    function(res) {

      const data = res.data();

      if (!data || data.length === 0) {

        log("➕ Поле не найдено, создаём...");

        BX24.callMethod(
          "crm.userfield.add",
          {
            fields: {
              FIELD_NAME: "UF_CRM_LAVINA_BOOKING_BUTTON",
              USER_TYPE_ID: "string",
              EDIT_FORM_LABEL: "Lavina Booking Button",
              LIST_COLUMN_LABEL: "Lavina Booking"
            }
          },
          function(r) {

            fieldCreated = true;

            if (r.error()) {
              log("❌ Ошибка создания поля: " + JSON.stringify(r.error()));
            } else {
              log("✔ Поле успешно создано");
            }
          }
        );

      } else {
        log("✔ Поле уже существует");
      }
    }
  );
}

/* =========================
   3. START
========================= */
window.addEventListener("load", function () {
  log("🚀 Старт приложения");
  initBitrix();
});

</script>

</body>
</html>
