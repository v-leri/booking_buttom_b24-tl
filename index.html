<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>LavinaBooking TL MVP</title>

  <style>
    /* =========================
       БАЗОВЫЕ СТИЛИ СТРАНИЦЫ
       ========================= */

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* КНОПКА БРОНИРОВАНИЯ */
    .btn {
      padding: 10px 14px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
    }

    /* ВЫПАДАЮЩИЙ СПИСОК */
    .dropdown {
      margin-top: 10px;
      display: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      background: #fff;
      max-width: 320px;

      /* важно для UI */
      position: absolute;
      z-index: 9999;
    }

    /* ЭЛЕМЕНТ ОТЕЛЯ */
    .item {
      padding: 6px;
      cursor: pointer;
    }

    .item:hover {
      background: #f2f2f2;
    }

    /* СЕРЫЙ КОД ОТЕЛЯ */
    .code {
      color: #999;
      font-size: 12px;
      margin-left: 6px;
    }
  </style>
</head>

<body>

<!-- =========================
     КНОПКА БРОНИРОВАНИЯ
     ========================= -->
<button class="btn" id="mainBtn">
  Загружаем отели...
</button>

<!-- =========================
     DROPDOWN СПИСОК ОТЕЛЕЙ
     ========================= -->
<div class="dropdown" id="dropdown"></div>

<script>

  /* =========================================================
     1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
     ========================================================= */

  let hotels = [];           // список отелей
  let selectedHotel = null;  // выбранный отель

  let dealId = null;         // ID сделки (Bitrix)
  let contactId = null;      // ID контакта (Bitrix)

  /* =========================================================
     2. ЗАГРУЗКА ОТЕЛЕЙ С JSON
     ========================================================= */

  fetch("hotels.json")
    .then(res => res.json())
    .then(data => {

      hotels = data;

      // по умолчанию берём первый отель
      selectedHotel = hotels[0];

      renderButton();
      renderDropdown();
    })
    .catch(err => {
      console.error("Ошибка загрузки hotels.json", err);
    });

  /* =========================================================
     3. БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ BITRIX24
     (ВАЖНО: НЕ ПАДАЕТ ЕСЛИ BITRIX НЕТ)
     ========================================================= */

  function initBitrixSafe() {

    // если BX24 не существует — просто выходим
    if (typeof BX24 === "undefined") {
      console.warn("BX24 не найден (режим обычного сайта)");
      return;
    }

    // безопасная инициализация
    BX24.init(function () {

      try {
        const placement = BX24.placement.info();

        dealId = placement?.options?.ID || null;

        console.log("Bitrix dealId:", dealId);

      } catch (e) {
        console.error("Ошибка BX24 placement", e);
      }
    });
  }

  /* =========================================================
     4. РЕНДЕР КНОПКИ
     ========================================================= */

  function renderButton() {
    document.getElementById("mainBtn").innerText =
      `Забронировать в ${selectedHotel.name} ▼`;
  }

  /* =========================================================
     5. РЕНДЕР DROPDOWN
     ========================================================= */

  function renderDropdown() {

    const dd = document.getElementById("dropdown");
    dd.innerHTML = "";

    hotels.forEach(h => {

      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        ${h.name}
        <span class="code">${h.providerId}</span>
      `;

      div.onclick = () => {
        selectedHotel = h;
        renderButton();
        dd.style.display = "none";
      };

      dd.appendChild(div);
    });
  }

  /* =========================================================
     6. ЛОГИКА КНОПКИ
     ========================================================= */

  function setupEvents() {

    const btn = document.getElementById("mainBtn");
    const dd = document.getElementById("dropdown");

    // открыть / закрыть dropdown
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      dd.style.display = (dd.style.display === "block") ? "none" : "block";
    });

    // закрытие при клике вне
    document.addEventListener("click", function () {
      dd.style.display = "none";
    });

    // БРОНИРОВАНИЕ (двойной клик для MVP)
    btn.addEventListener("dblclick", book);
  }

  /* =========================================================
     7. ОТКРЫТИЕ TRAVEL LINE
     ========================================================= */

  function book() {

    const payload = {
      firstName: "Test",
      lastName: "User",
      providerId: selectedHotel.providerId,
      dealId: dealId || "0",
      contactId: contactId || "0"
    };

    const url =
      "https://secure.travelline.ru/app/webpms/extranet/#/WebPmsBookingNew/" +
      encodeURIComponent(JSON.stringify(payload)) +
      "/WebPmsReservations";

    window.open(url, "_blank");
  }

  /* =========================================================
     8. СТАРТ ПРИЛОЖЕНИЯ
     ========================================================= */

  window.addEventListener("load", function () {

    setupEvents();      // UI
    initBitrixSafe();   // Bitrix (если есть)

  });

</script>

</body>
</html>
