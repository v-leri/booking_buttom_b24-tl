<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>LavinaBooking TL MVP</title>

  <style>
    /* =========================
       БАЗОВЫЙ СТИЛЬ
       ========================= */

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* КОНТЕЙНЕР КНОПКИ (чтобы разделить зоны клика) */
    .btn-wrapper {
      display: inline-flex;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
    }

    /* ОСНОВНАЯ КНОПКА (клик = бронирование) */
    .btn-main {
      padding: 10px 14px;
      background: #fff;
      cursor: pointer;
      border: none;
      font-size: 14px;
    }

    /* КНОПКА СТРЕЛКИ (клик = dropdown) */
    .btn-arrow {
      padding: 10px 12px;
      background: #f5f5f5;
      cursor: pointer;
      border: none;
      border-left: 1px solid #ccc;
    }

    /* DROPDOWN */
    .dropdown {
      margin-top: 8px;
      display: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      max-width: 320px;
      position: absolute;
      z-index: 9999;
    }

    .item {
      padding: 8px;
      cursor: pointer;
    }

    .item:hover {
      background: #f2f2f2;
    }

    .code {
      color: #999;
      font-size: 12px;
      margin-left: 6px;
    }
  </style>
</head>

<body>

<!-- =========================
     КНОПКА + СТРЕЛКА
     ========================= -->
<div class="btn-wrapper">

  <!-- основная кнопка -->
  <button class="btn-main" id="mainBtn">
    Загружаем отели...
  </button>

  <!-- стрелка -->
  <button class="btn-arrow" id="arrowBtn">
    ▼
  </button>

</div>

<!-- dropdown -->
<div class="dropdown" id="dropdown"></div>

<script>

  /* =========================
     ДАННЫЕ
     ========================= */

  let hotels = [];
  let selectedHotel = null;

  let dealId = null;
  let contactId = null;

  /* =========================
     ЗАГРУЗКА ОТЕЛЕЙ
     ========================= */

  fetch("hotels.json")
    .then(r => r.json())
    .then(data => {

      hotels = data;
      selectedHotel = hotels[0];

      renderButton();
      renderDropdown();
    })
    .catch(err => {
      console.error("Ошибка hotels.json", err);
    });

  /* =========================
     BITRIX SAFE INIT
     ========================= */

  function initBitrix() {

    if (typeof BX24 === "undefined") {
      console.warn("BX24 не найден (обычный режим)");
      return;
    }

    BX24.init(function () {
      try {
        const placement = BX24.placement.info();
        dealId = placement?.options?.ID || null;
      } catch (e) {
        console.error("BX24 error", e);
      }
    });
  }

  /* =========================
     ОТОБРАЖЕНИЕ КНОПКИ
     ========================= */

  function renderButton() {
    document.getElementById("mainBtn").innerText =
      `Забронировать в ${selectedHotel.name}`;
  }

  /* =========================
     DROPDOWN ОТЕЛЕЙ
     ========================= */

  function renderDropdown() {

    const dd = document.getElementById("dropdown");
    dd.innerHTML = "";

    hotels.forEach(h => {

      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        ${h.name}
        <span class="code">${h.providerId}</span>
      `;

      /* =========================
         ОДИН КЛИК = ВЫБОР + БРОНЬ
         ========================= */
      div.onclick = () => {
        selectedHotel = h;
        renderButton();
        dd.style.display = "none";

        openTravelLine(); // ВАЖНО: сразу открываем
      };

      dd.appendChild(div);
    });
  }

  /* =========================
     ПОВЕДЕНИЕ КНОПОК
     ========================= */

  function setupEvents() {

    const mainBtn = document.getElementById("mainBtn");
    const arrowBtn = document.getElementById("arrowBtn");
    const dd = document.getElementById("dropdown");

    /* =========================
       КЛИК ПО ОСНОВНОЙ КНОПКЕ
       → СРАЗУ БРОНИРОВАНИЕ
       ========================= */
    mainBtn.addEventListener("click", () => {
      openTravelLine();
    });

    /* =========================
       КЛИК ПО СТРЕЛКЕ
       → ОТКРЫТЬ DROPDOWN
       ========================= */
    arrowBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dd.style.display = (dd.style.display === "block") ? "none" : "block";
    });

    /* =========================
       ЗАКРЫТИЕ ПО КЛИКУ ВНЕ
       ========================= */
    document.addEventListener("click", () => {
      dd.style.display = "none";
    });
  }

  /* =========================
     TRAVEL LINE OPEN
     ========================= */

  function openTravelLine() {

    const payload = {
      firstName: "Test",
      lastName: "User",
      providerId: selectedHotel.providerId,
      dealId: dealId || "0",
      contactId: contactId || "0"
    };

    const url =
      "https://secure.travelline.ru/app/webpms/extranet/#/WebPmsBookingNew/" +
      encodeURIComponent(JSON.stringify(payload)) +
      "/WebPmsReservations";

    // ВАЖНО: открытие окна
    window.open(url, "_blank");
  }

  /* =========================
     СТАРТ ПРИЛОЖЕНИЯ
     ========================= */

  window.addEventListener("load", () => {

    setupEvents();
    initBitrix();

  });

</script>

</body>
</html>
