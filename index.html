<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>LavinaBooking CRM Field Renderer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
    }

    /* ===== ЕДИНАЯ КНОПКА ===== */
    .btn-wrap {
      display: inline-flex;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    /* ОСНОВНАЯ ЧАСТЬ КНОПКИ */
    .btn-main {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: #fff;
      white-space: nowrap;
    }

    /* СТРЕЛКА */
    .btn-arrow {
      padding: 8px 10px;
      cursor: pointer;
      border: none;
      border-left: 1px solid #ddd;
      background: #f5f5f5;
    }

    /* DROPDOWN */
    .dropdown {
      position: absolute;
      margin-top: 6px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      min-width: 240px;
      display: none;
      z-index: 9999;
    }

    .item {
      padding: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .item:hover {
      background: #f2f2f2;
    }

    .code {
      color: #999;
      font-size: 11px;
    }
  </style>
</head>

<body>

<!-- ===== КНОПКА ===== -->
<div class="btn-wrap">
  <button id="mainBtn" class="btn-main"></button>
  <button id="arrowBtn" class="btn-arrow">▼</button>
</div>

<!-- ===== СПИСОК ===== -->
<div id="dropdown" class="dropdown"></div>

<script>

  /* =========================
     1. ДАННЫЕ ОТЕЛЕЙ
     ========================= */

  let hotels = [
    { name: "ОТЕЛЬ 1", providerId: "16478" },
    { name: "ОТЕЛЬ 2", providerId: "22222" },
    { name: "ОТЕЛЬ 3", providerId: "33333" }
  ];

  let selectedHotel = hotels[0];

  let dealId = null;
  let contactId = null;

  /* =========================
     2. BITRIX INIT (БЕЗОПАСНО)
     ========================= */

  function initBitrix() {

    if (typeof BX24 === "undefined") return;

    BX24.init(() => {
      try {
        const p = BX24.placement.info();
        dealId = p?.options?.ID || null;
      } catch (e) {}
    });
  }

  /* =========================
     3. ОТОБРАЖЕНИЕ КНОПКИ
     ========================= */

  function renderButton() {
    document.getElementById("mainBtn").innerText =
      `Забронировать в ${selectedHotel.name}`;
  }

  /* =========================
     4. DROPDOWN С ОТЕЛЯМИ
     ========================= */

  function renderDropdown() {

    const dd = document.getElementById("dropdown");
    dd.innerHTML = "";

    hotels.forEach(h => {

      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <span>${h.name}</span>
        <span class="code">${h.providerId}</span>
      `;

      /* ===== ВЫБОР ОТЕЛЯ = СРАЗУ БРОНЬ ===== */
      div.onclick = () => {
        selectedHotel = h;
        renderButton();
        dd.style.display = "none";
        openTravelLine();
      };

      dd.appendChild(div);
    });
  }

  /* =========================
     5. TRAVEL LINE OPEN
     ========================= */

  function openTravelLine() {

    const payload = {
      firstName: "Test",
      lastName: "User",
      providerId: selectedHotel.providerId,
      dealId: dealId || "0",
      contactId: contactId || "0"
    };

    const url =
      "https://secure.travelline.ru/app/webpms/extranet/#/WebPmsBookingNew/" +
      encodeURIComponent(JSON.stringify(payload)) +
      "/WebPmsReservations";

    window.open(url, "_blank");
  }

  /* =========================
     6. EVENTS
     ========================= */

  function bindEvents() {

    const main = document.getElementById("mainBtn");
    const arrow = document.getElementById("arrowBtn");
    const dd = document.getElementById("dropdown");

    /* ===== КЛИК ПО ОСНОВНОЙ КНОПКЕ = БРОНЬ ===== */
    main.onclick = openTravelLine;

    /* ===== СТРЕЛКА = ОТКРЫТЬ СПИСОК ===== */
    arrow.onclick = (e) => {
      e.stopPropagation();
      dd.style.display = dd.style.display === "block" ? "none" : "block";
    };

    document.addEventListener("click", () => {
      dd.style.display = "none";
    });
  }

  /* =========================
     7. СТАРТ
     ========================= */

  window.addEventListener("load", () => {

    renderButton();
    renderDropdown();
    bindEvents();
    initBitrix();

  });

</script>

</body>
</html>
